const letters="ABCDEFGH";
let mode="quiz", subject="alg", answers={};

function key(){return subject+"_"+mode}
function setMode(m){
 mode=m; answers={};
 quizBtn.classList.toggle("on",m==="quiz");
 testBtn.classList.toggle("on",m==="test");
 finish.style.display=m==="test"?"inline-block":"none";
 render();
}
function setSubject(s){
 subject=s; answers={};
 algBtn.classList.toggle("on",s==="alg");
 dbBtn.classList.toggle("on",s==="db");
 render();
}
function same(a,b){return JSON.stringify([...a].sort((x,y)=>x-y))===JSON.stringify([...b].sort((x,y)=>x-y))}
function render(){
 const arr=D[subject];
 info.textContent=(subject==="alg"?"Алгоритмы и структуры данных":"Базы данных")+" · "+arr.length+" вопросов";
 questions.innerHTML=arr.map((x,i)=>{
   const multi=x.a.length>1;
   return `<div class="q" id="q${i}">
    <div class="num">ВОПРОС ${i+1} / ${arr.length}${multi?" · НЕСКОЛЬКО ОТВЕТОВ":""}</div>
    <h3>${escapeHtml(x.q)}</h3>
    ${x.o.map((o,j)=>`<label class="opt" data-j="${j}">
      <input type="${multi?"checkbox":"radio"}" name="q${i}" value="${j}" onchange="choose(${i},${j},this)">
      <span><b>${letters[j]}.</b> ${escapeHtml(o)}</span>
    </label>`).join("")}
    <div class="exp" id="e${i}">${escapeHtml(x.e)}</div>
   </div>`
 }).join("");
 result.classList.remove("show");
 finish.style.display=mode==="test"?"inline-block":"none";
}
function choose(i,j,input){
 const x=D[subject][i];
 if(x.a.length>1){
   answers[i]=[...document.querySelectorAll(`#q${i} input:checked`)].map(e=>+e.value);
   if(mode==="quiz") return; // multi-answer is checked when selection is complete via result button only
 } else {
   answers[i]=[j];
   if(mode==="quiz") checkOne(i);
 }
}
function checkOne(i){
 const x=D[subject][i], chosen=answers[i]||[];
 const q=document.getElementById("q"+i);
 q.querySelectorAll("input").forEach(e=>e.disabled=true);
 q.querySelectorAll(".opt").forEach((el,j)=>{
   if(x.a.includes(j)) el.classList.add("good");
   else if(chosen.includes(j)) el.classList.add("bad");
 });
 document.getElementById("e"+i).classList.add("show");
}
function finishTest(){
 let score=0;
 D[subject].forEach((x,i)=>{
   const chosen=answers[i]||[];
   if(same(chosen,x.a)) score++;
   const q=document.getElementById("q"+i);
   q.querySelectorAll(".opt").forEach((el,j)=>{
     if(x.a.includes(j)) el.classList.add("good");
     else if(chosen.includes(j)) el.classList.add("bad");
   });
   q.querySelectorAll("input").forEach(e=>e.disabled=true);
   document.getElementById("e"+i).classList.add("show");
 });
 result.innerHTML=`<strong>${score} / ${D[subject].length}</strong><div>Правильных ответов · ${Math.round(score/D[subject].length*100)}%</div>`;
 result.classList.add("show");
 result.scrollIntoView({behavior:"smooth",block:"center"});
}
function resetAll(){answers={};render();scrollTo({top:0,behavior:"smooth"})}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
render();
</script>
